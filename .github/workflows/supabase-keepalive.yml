name: Giữ Supabase hoạt động

# Dự án Supabase gói miễn phí bị tạm dừng nếu ít hoạt động trong 7 ngày.
# Khóa bên dưới là khóa công khai (publishable), cùng khóa nằm trong game. Tác vụ này đọc bảng xếp hạng vài ngày một lần để dự án luôn có hoạt động.
# Nếu lần gọi thất bại (ví dụ dự án đã bị tạm dừng), tác vụ báo lỗi và GitHub gửi email cho bạn.

on:
  schedule:
    - cron: "17 2 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Đọc bảng xếp hạng
        run: |
          url="https://hufurknrilinkskvkkjo.supabase.co"
          key="sb_publishable_2dSwQAHS7F3xSHhfZL9WLg_pqCCx5UK"
          code=$(curl -sS -o body.json -w '%{http_code}' --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: $key" "$url/rest/v1/scores?select=name,score&order=score.desc&limit=1")
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "Supabase không trả về 200. Có thể dự án đã bị tạm dừng."; exit 1; }
          echo "Số dòng trả về: $(grep -o '"name"' body.json | wc -l)"
