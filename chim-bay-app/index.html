<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chim Bay</title>
<meta name="theme-color" content="#0e2433">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Chim Bay">
<meta name="description" content="Game chim bay qua ống: chạm để vỗ cánh và ghi điểm.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
html { color-scheme: dark; }
body { margin: 0; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
[hidden] { display: none !important; }
</style>
<style>
/* One-screen game: a 360x640 canvas scaled to fit the viewport, centred on a deep night-blue ground. Single look by choice. */
:root {
  --ground: #0e2433;
  --ink: #eaf4fa;
  --muted: #8fb0c4;
  --font: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ground); color: var(--ink); font-family: var(--font);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding-inline: 16px; padding-block: 10px; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
#stage { display: block; border-radius: 16px; touch-action: none; box-shadow: 0 10px 40px rgba(0,0,0,.45); cursor: pointer; background: #7ccbf0; }
#stage:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }
.hint { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; }
.lb { position: fixed; inset: 0; z-index: 10; background: rgba(8, 16, 24, .84); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding-inline: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.lbBox { width: min(360px, 100%); background: #fff6d6; color: #1c3b4d; border: 3px solid #7a4b00; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; -webkit-user-select: text; user-select: text; }
.lbBox h2 { margin: 0; font-size: 26px; color: #b3401a; text-align: center; text-wrap: balance; }
.lbMsg { margin: 0; min-height: 1.4em; font-size: 15px; font-weight: 600; color: #5a4a2a; text-align: center; }
.lbList { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.lbList li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 10px; background: rgba(122, 75, 0, .08); font-size: 17px; font-weight: 600; }
.lbList li.me { background: #ffd23f; }
.lbList .rk { font-variant-numeric: tabular-nums; color: #7a4b00; }
.lbList .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbList .sc { font-variant-numeric: tabular-nums; font-weight: 700; }
.lbForm { display: flex; flex-direction: column; gap: 6px; }
.lbForm label { font-size: 14px; font-weight: 600; color: #5a4a2a; }
.lbRow { display: flex; gap: 8px; }
.lbRow input { flex: 1; min-width: 0; min-height: 44px; border-radius: 10px; border: 2px solid #7a4b00; background: #fff; color: #1c3b4d; padding: 8px 12px; font: 600 16px var(--font); -webkit-user-select: text; user-select: text; }
.lbRow button, .lbClose { min-height: 44px; padding: 8px 18px; border-radius: 10px; border: 2px solid #7a4b00; background: #ffd23f; color: #1c3b4d; font: 700 16px var(--font); cursor: pointer; }
.lbClose { background: #fff; }
.lb button:focus-visible, .lb input:focus-visible { outline: 3px solid #1c3b4d; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="Màn chơi Chim Bay. Chạm hoặc nhấn phím cách để chim vỗ cánh."></canvas>
<p class="hint">Chạm vào màn hình, nhấn phím cách hoặc mũi tên lên để vỗ cánh. Bấm biểu tượng loa hoặc phím M để tắt nhạc.</p>

<div class="lb" id="lb" hidden>
  <div class="lbBox" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
    <h2 id="lbTitle">Bảng xếp hạng</h2>
    <p class="lbMsg" id="lbMsg" role="status"></p>
    <ol class="lbList" id="lbList"></ol>
    <form class="lbForm" id="lbForm">
      <label for="lbName">Biệt danh của bạn</label>
      <div class="lbRow">
        <input id="lbName" type="text" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="2 đến 12 ký tự">
        <button type="submit">Lưu</button>
      </div>
    </form>
    <button class="lbClose" id="lbClose" type="button">Đóng</button>
  </div>
</div>

<script src="config.js"></script>

<script>
(function () {
  var W = 360, H = 640, GROUND = 96;
  var cv = document.getElementById("stage"), ctx = cv.getContext("2d");
  var GRAV = 1500, FLAP = -440, SPEED = 150, GAP = 128, PIPE_W = 64, SPACING = 200;
  var BIRD_X = 96, R = 15;
  var state = "ready", score = 0, best = 0, overAt = 0, shake = 0, justDied = false;
  var bird, pipes, groundX = 0, clouds = [], t = 0;

  try { best = parseInt(localStorage.getItem("chimbay-best"), 10) || 0; } catch (e) {}

  for (var i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 260, s: 0.6 + Math.random() * 0.8, v: 6 + Math.random() * 10 });

  function reset() {
    bird = { y: H / 2 - 40, vy: 0, rot: 0 };
    pipes = []; score = 0; groundX = 0;
  }
  reset();

  function fit() {
    var availW = window.innerWidth - 32, availH = window.innerHeight - 64;
    var s = Math.min(availW / W, availH / H, 1.6);
    var cssW = Math.max(200, Math.floor(W * s)), cssH = Math.floor(cssW * H / W);
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.style.width = cssW + "px"; cv.style.height = cssH + "px";
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  window.addEventListener("resize", fit); fit();

  // Background music: a looping 4-bar tune (C - Am - F - G) synthesised with Web Audio, so no audio file is needed.
  var music = (function () {
    var AC = window.AudioContext || window.webkitAudioContext;
    var actx = null, master = null, timer = null, step = 0, nextT = 0, muted = false, LEVEL = 0.22;
    var EIGHTH = 60 / 112 / 2;
    var LEAD = [76,0,79,0,76,74,72,0,  72,0,76,0,81,76,72,0,  77,0,81,0,77,76,72,0,  79,0,74,0,71,74,79,0];
    var ROOTS = [48, 45, 41, 43];
    try { muted = localStorage.getItem("chimbay-muted") === "1"; } catch (e) {}
    function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
    function tone(type, m, t, dur, vol) {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = hz(m);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
    }
    function schedule() {
      while (nextT < actx.currentTime + 0.35) {
        var i = step % 32, bar = Math.floor(i / 8), s = i % 8;
        if (LEAD[i]) tone("square", LEAD[i], nextT, EIGHTH * 0.9, 0.16);
        if (s % 2 === 0) tone("triangle", ROOTS[bar] + (s === 2 || s === 6 ? 7 : 0), nextT, EIGHTH * 1.8, 0.5);
        step++; nextT += EIGHTH;
      }
    }
    function run() {
      if (!actx || muted || timer) return;
      master.gain.value = LEVEL;
      nextT = actx.currentTime + 0.05;
      timer = setInterval(schedule, 100);
    }
    function halt() { if (timer) { clearInterval(timer); timer = null; } if (master) master.gain.value = 0; }
    // Must be called from a tap or key press: iOS Safari only allows audio to start from a user gesture.
    function unlock() {
      if (!AC) return;
      try {
        if (!actx) { actx = new AC(); master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination); }
        if (actx.state === "suspended") actx.resume();
        run();
      } catch (e) {}
    }
    function toggle() {
      muted = !muted;
      try { localStorage.setItem("chimbay-muted", muted ? "1" : "0"); } catch (e) {}
      if (muted) halt(); else unlock();
    }
    document.addEventListener("visibilitychange", function () {
      if (!actx) return;
      try { if (document.hidden) actx.suspend(); else if (!muted) actx.resume(); } catch (e) {}
    });
    return { unlock: unlock, toggle: toggle, isMuted: function () { return muted; } };
  })();

  // Optional leaderboard. When a run ends, the game sends the score straight to Supabase (submit_score).
  // There is no cheat checking by design. Fill in config.js to turn it on.
  var LBC = window.CHIMBAY_LEADERBOARD || {};
  var LB_ON = !!(LBC.url && LBC.key);
  var lbName = "", lbPending = null, lbStatus = "";
  var lbEl = { box: document.getElementById("lb"), msg: document.getElementById("lbMsg"), list: document.getElementById("lbList"),
    form: document.getElementById("lbForm"), name: document.getElementById("lbName"), close: document.getElementById("lbClose") };
  try { lbName = localStorage.getItem("chimbay-name") || ""; } catch (e) {}
  if (LB_ON) document.querySelector(".hint").textContent += " Bấm cúp để xem bảng xếp hạng.";

  function lbFetch(path, init) {
    var ctrl = new AbortController(), to = setTimeout(function () { ctrl.abort(); }, 8000);
    init = init || {}; init.signal = ctrl.signal;
    init.headers = { apikey: LBC.key, "Content-Type": "application/json" };
    // Older Supabase keys are JWTs and are also sent as a bearer token; newer "publishable" keys go in apikey only.
    if (/^eyJ/.test(LBC.key)) init.headers.Authorization = "Bearer " + LBC.key;
    return fetch(LBC.url.replace(/\/+$/, "") + path, init).then(function (res) {
      clearTimeout(to);
      return res.text().then(function (txt) {
        var data = null; try { data = txt ? JSON.parse(txt) : null; } catch (e) {}
        if (!res.ok) throw new Error((data && data.message) || ("HTTP " + res.status));
        return data;
      });
    }, function (e) { clearTimeout(to); throw e; });
  }
  function lbStart() { lbPending = null; lbStatus = ""; }
  function lbSubmit(name, sc) {
    lbStatus = "Đang gửi điểm…";
    return lbFetch("/rest/v1/rpc/submit_score", { method: "POST", body: JSON.stringify({ p_name: name, p_score: sc }) })
      .then(function () { lbStatus = "Đã gửi lên bảng xếp hạng"; }, function () { lbStatus = "Chưa gửi được điểm"; });
  }
  function lbOnDie() {
    if (!LB_ON || score <= 0) { lbStatus = ""; return; }
    var sc = score;
    if (!lbName) {
      lbPending = { score: sc };
      lbStatus = "Bấm cúp để nhập biệt danh";
      setTimeout(function () { if (state === "over" && lbPending && lbPending.score === sc) lbOpen("name"); }, 600);
    } else { lbSubmit(lbName, sc); }
  }
  function lbIsOpen() { return !lbEl.box.hidden; }
  function lbRender(rows) {
    lbEl.list.textContent = "";
    rows.forEach(function (r, i) {
      var li = document.createElement("li"); if (lbName && r.name === lbName) li.className = "me";
      [["rk", String(i + 1)], ["nm", r.name], ["sc", String(r.score)]].forEach(function (c) {
        var sp = document.createElement("span"); sp.className = c[0]; sp.textContent = c[1]; li.appendChild(sp);
      });
      lbEl.list.appendChild(li);
    });
  }
  function lbRefresh() {
    lbEl.msg.textContent = "Đang tải…";
    return lbFetch("/rest/v1/scores?select=name,score&order=score.desc,updated_at.asc&limit=10").then(function (rows) {
      rows = Array.isArray(rows) ? rows : [];
      lbRender(rows);
      lbEl.msg.textContent = rows.length ? "" : "Chưa có ai trên bảng. Hãy là người đầu tiên!";
    }, function () { lbEl.list.textContent = ""; lbEl.msg.textContent = "Không tải được bảng xếp hạng. Kiểm tra mạng rồi mở lại."; });
  }
  function lbOpen(mode) {
    if (!LB_ON) return;
    lbEl.name.value = lbName; lbEl.box.hidden = false;
    lbRefresh().then(function () {
      if (mode === "name" && lbPending) lbEl.msg.textContent = "Nhập biệt danh để điểm " + lbPending.score + " lên bảng.";
    });
    if (mode === "name") lbEl.name.focus(); else lbEl.close.focus();
  }
  function lbClose() { lbEl.box.hidden = true; }
  lbEl.close.addEventListener("click", lbClose);
  lbEl.box.addEventListener("pointerdown", function (e) { if (e.target === lbEl.box) lbClose(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && lbIsOpen()) lbClose(); });
  lbEl.form.addEventListener("submit", function (e) {
    e.preventDefault();
    var n = lbEl.name.value.replace(/\s+/g, " ").trim(), len = Array.from(n).length;
    if (len < 2 || len > 12) { lbEl.msg.textContent = "Biệt danh cần từ 2 đến 12 ký tự."; return; }
    lbName = n; try { localStorage.setItem("chimbay-name", n); } catch (err) {}
    if (lbPending) { var p = lbPending; lbPending = null; lbSubmit(n, p.score).then(lbRefresh); }
    else { lbRefresh().then(function () { lbEl.msg.textContent = "Đã lưu biệt danh."; }); }
  });

  function flap() {
    var now = performance.now();
    if (state === "ready") { state = "play"; bird.vy = FLAP; lbStart(); }
    else if (state === "play") { bird.vy = FLAP; }
    else if (state === "over" && now - overAt > 450) { reset(); state = "ready"; }
  }
  function hitButton(e) {
    if (state === "play") return null;
    var r = cv.getBoundingClientRect();
    var lx = (e.clientX - r.left) * W / r.width, ly = (e.clientY - r.top) * H / r.height;
    if (ly >= 64) return null;
    if (lx > W - 64) return "mute";
    if (LB_ON && lx < 64) return "trophy";
    return null;
  }
  cv.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var hit = hitButton(e);
    if (hit === "mute") { music.toggle(); return; }
    if (hit === "trophy") { music.unlock(); lbOpen("view"); return; }
    music.unlock(); flap();
  });
  cv.addEventListener("pointerup", function () { music.unlock(); });
  window.addEventListener("keydown", function (e) {
    if (lbIsOpen()) return;
    if (e.code === "KeyM") { if (!e.repeat) music.toggle(); return; }
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); music.unlock(); if (!e.repeat) flap(); }
  });
  document.addEventListener("visibilitychange", function () { last = 0; });

  function spawn() {
    var min = 70, max = H - GROUND - GAP - 70;
    pipes.push({ x: W + 10, top: min + Math.random() * (max - min), scored: false });
  }

  // die() may be reached twice in one frame (pipe and ground). It only flags the end of the run;
  // the score is settled once per run in frame(), after update() has finished adding points.
  function die() {
    if (state === "over") return;
    state = "over"; overAt = performance.now(); shake = 0.25; justDied = true;
  }
  function settleRun() {
    if (score > best) { best = score; try { localStorage.setItem("chimbay-best", String(best)); } catch (e) {} }
    lbOnDie();
  }

  function hitsPipe(p) {
    if (BIRD_X + R < p.x || BIRD_X - R > p.x + PIPE_W) return false;
    return bird.y - R < p.top || bird.y + R > p.top + GAP;
  }

  function update(dt) {
    t += dt;
    clouds.forEach(function (c) { c.x -= c.v * dt; if (c.x < -80) { c.x = W + 40; c.y = 40 + Math.random() * 260; } });
    if (shake > 0) shake = Math.max(0, shake - dt);

    if (state === "ready") {
      bird.y = H / 2 - 40 + Math.sin(t * 4) * 8; bird.rot = 0;
      groundX = (groundX + SPEED * dt) % 24; return;
    }
    if (state === "play") {
      groundX = (groundX + SPEED * dt) % 24;
      bird.vy += GRAV * dt; bird.y += bird.vy * dt;
      bird.rot = Math.max(-0.45, Math.min(1.3, bird.vy / 520));
      if (!pipes.length || pipes[pipes.length - 1].x < W - SPACING) spawn();
      for (var i = pipes.length - 1; i >= 0; i--) {
        if (state !== "play") break;
        var p = pipes[i]; p.x -= SPEED * dt;
        if (!p.scored && p.x + PIPE_W < BIRD_X - R) { p.scored = true; score++; }
        if (p.x + PIPE_W < -4) pipes.splice(i, 1);
        else if (hitsPipe(p)) { die(); }
      }
      if (bird.y - R < 0) { bird.y = R; bird.vy = 0; }
      if (bird.y + R > H - GROUND) { bird.y = H - GROUND - R; die(); }
    } else if (state === "over") {
      if (bird.y + R < H - GROUND) { bird.vy += GRAV * dt; bird.y += bird.vy * dt; bird.rot = Math.min(1.5, bird.rot + 6 * dt); if (bird.y + R > H - GROUND) bird.y = H - GROUND - R; }
    }
  }

  function cloud(c) {
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 18 * c.s, 0, 7); ctx.arc(c.x + 20 * c.s, c.y - 8 * c.s, 22 * c.s, 0, 7);
    ctx.arc(c.x + 44 * c.s, c.y, 17 * c.s, 0, 7); ctx.rect(c.x, c.y, 44 * c.s, 17 * c.s);
    ctx.fill();
  }

  function pipe(p) {
    var capH = 26, capX = p.x - 4, capW = PIPE_W + 8;
    function body(y, h) {
      var g = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
      g.addColorStop(0, "#4aa83a"); g.addColorStop(.35, "#8fe05a"); g.addColorStop(1, "#3d8f31");
      ctx.fillStyle = g; ctx.fillRect(p.x, y, PIPE_W, h);
      ctx.strokeStyle = "#285c20"; ctx.lineWidth = 2.5; ctx.strokeRect(p.x, y, PIPE_W, h);
    }
    function cap(y) {
      var g = ctx.createLinearGradient(capX, 0, capX + capW, 0);
      g.addColorStop(0, "#4aa83a"); g.addColorStop(.35, "#8fe05a"); g.addColorStop(1, "#3d8f31");
      ctx.fillStyle = g; ctx.fillRect(capX, y, capW, capH);
      ctx.strokeStyle = "#285c20"; ctx.lineWidth = 2.5; ctx.strokeRect(capX, y, capW, capH);
    }
    body(-4, p.top - capH + 4); cap(p.top - capH);
    var bottom = p.top + GAP;
    body(bottom + capH, H - GROUND - bottom - capH + 4); cap(bottom);
  }

  function drawBird() {
    ctx.save(); ctx.translate(BIRD_X, bird.y); ctx.rotate(bird.rot);
    var wing = state === "over" ? 0.2 : Math.sin(t * 22) * 0.5;
    ctx.fillStyle = "#ffd23f"; ctx.strokeStyle = "#7a4b00"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, 0, R + 3, R, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.moveTo(R, -2); ctx.lineTo(R + 11, 2); ctx.lineTo(R, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(7, -6, 6, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(9, -6, 2.4, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(-5, 3); ctx.rotate(wing);
    ctx.fillStyle = "#ffb703"; ctx.beginPath(); ctx.ellipse(0, 0, 9, 6, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.restore();
  }

  function outline(text, x, y, size, fill) {
    ctx.font = "700 " + size + "px " + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = "center"; ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(4, size / 6); ctx.strokeStyle = "#1c3b4d"; ctx.strokeText(text, x, y);
    ctx.fillStyle = fill || "#fff"; ctx.fillText(text, x, y);
  }

  function drawSpeaker(cx, cy) {
    ctx.save(); ctx.translate(cx, cy);
    ctx.fillStyle = "rgba(28,59,77,.78)"; ctx.beginPath(); ctx.arc(0, 0, 20, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-9, -4); ctx.lineTo(-4, -4); ctx.lineTo(2, -9); ctx.lineTo(2, 9); ctx.lineTo(-4, 4); ctx.lineTo(-9, 4); ctx.closePath(); ctx.fill();
    if (music.isMuted()) {
      ctx.strokeStyle = "#ff8a6b"; ctx.beginPath(); ctx.moveTo(7, -5); ctx.lineTo(15, 5); ctx.moveTo(15, -5); ctx.lineTo(7, 5); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(2, 0, 7, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(2, 0, 12, -0.9, 0.9); ctx.stroke();
    }
    ctx.restore();
  }

  function drawTrophy(cx, cy) {
    ctx.save(); ctx.translate(cx, cy);
    ctx.fillStyle = "rgba(28,59,77,.78)"; ctx.beginPath(); ctx.arc(0, 0, 20, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffd23f"; ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-8, -10); ctx.lineTo(8, -10); ctx.lineTo(8, -4); ctx.quadraticCurveTo(8, 4, 0, 4); ctx.quadraticCurveTo(-8, 4, -8, -4); ctx.closePath(); ctx.fill();
    ctx.fillRect(-2, 4, 4, 5); ctx.fillRect(-7, 9, 14, 3);
    ctx.beginPath(); ctx.arc(-8, -5, 4, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(8, -5, 4, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * 8 * shake * 4, (Math.random() - .5) * 8 * shake * 4);
    var sky = ctx.createLinearGradient(0, 0, 0, H - GROUND);
    sky.addColorStop(0, "#5ab8ea"); sky.addColorStop(1, "#bfe8f7");
    ctx.fillStyle = sky; ctx.fillRect(-10, -10, W + 20, H);
    clouds.forEach(cloud);
    pipes.forEach(pipe);

    ctx.fillStyle = "#ded895"; ctx.fillRect(-10, H - GROUND, W + 20, GROUND + 10);
    ctx.fillStyle = "#73bf2e"; ctx.fillRect(-10, H - GROUND, W + 20, 16);
    ctx.fillStyle = "#5aa11f";
    for (var x = -24 + (-groundX % 24); x < W + 24; x += 24) { ctx.beginPath(); ctx.moveTo(x, H - GROUND); ctx.lineTo(x + 12, H - GROUND); ctx.lineTo(x + 24, H - GROUND + 16); ctx.lineTo(x + 12, H - GROUND + 16); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = "#2f5d14"; ctx.fillRect(-10, H - GROUND, W + 20, 3);

    drawBird();

    if (state !== "ready") outline(String(score), W / 2, 92, 52);
    if (state === "ready") {
      outline("Chim Bay", W / 2, 150, 46, "#ffd23f");
      outline("Chạm để bắt đầu", W / 2, 380, 24);
      ctx.font = "600 16px " + getComputedStyle(document.body).fontFamily; ctx.fillStyle = "#1c3b4d"; ctx.textAlign = "center";
      if (best) ctx.fillText("Kỷ lục: " + best, W / 2, 410);
      if (LB_ON && lbName) ctx.fillText("Biệt danh: " + lbName, W / 2, 436);
    }
    if (state === "over") {
      ctx.fillStyle = "#fff6d6"; ctx.strokeStyle = "#7a4b00"; ctx.lineWidth = 3;
      var bx = 50, by = 200, bw = W - 100, bh = LB_ON && score > 0 ? 214 : 190, r = 14;
      ctx.beginPath(); ctx.moveTo(bx + r, by); ctx.arcTo(bx + bw, by, bx + bw, by + bh, r); ctx.arcTo(bx + bw, by + bh, bx, by + bh, r); ctx.arcTo(bx, by + bh, bx, by, r); ctx.arcTo(bx, by, bx + bw, by, r); ctx.closePath(); ctx.fill(); ctx.stroke();
      var ff = getComputedStyle(document.body).fontFamily;
      ctx.textAlign = "center"; ctx.fillStyle = "#b3401a"; ctx.font = "700 30px " + ff; ctx.fillText("Hết lượt", W / 2, by + 44);
      ctx.fillStyle = "#5a4a2a"; ctx.font = "600 15px " + ff; ctx.fillText("ĐIỂM", W / 2 - 60, by + 82); ctx.fillText("KỶ LỤC", W / 2 + 60, by + 82);
      ctx.fillStyle = "#1c3b4d"; ctx.font = "700 40px " + ff; ctx.fillText(String(score), W / 2 - 60, by + 124); ctx.fillText(String(best), W / 2 + 60, by + 124);
      ctx.fillStyle = "#5a4a2a"; ctx.font = "600 15px " + ff;
      ctx.fillText(score > 0 && score === best ? "Kỷ lục mới!" : "Chạm để chơi lại", W / 2, by + 168);
      if (LB_ON && score > 0 && lbStatus) { ctx.fillStyle = "#7a4b00"; ctx.font = "600 14px " + ff; ctx.fillText(lbStatus, W / 2, by + 196); }
    }
    if (state !== "play") drawSpeaker(W - 40, 36);
    if (LB_ON && state !== "play") drawTrophy(40, 36);
    ctx.restore();
  }

  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt);
    if (justDied) { justDied = false; settleRun(); }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
